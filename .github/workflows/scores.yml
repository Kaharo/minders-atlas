name: scores
on:
  schedule:
    - cron: '0 7 * * 3'   # по средам, 12:00 Астана
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency: atlas-data
jobs:
  scores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Сверить рейтинги
        run: node scripts/update-scores.mjs
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
      - name: Проверить данные
        run: node scripts/validate-data.mjs
      - name: Проверить сборку сайта
        run: npm run build
      - name: Опубликовать
        id: pub
        run: |
          git config user.name "atlas-bot"
          git config user.email "atlas-bot@users.noreply.github.com"
          git add data/scores.json
          if git diff --cached --quiet; then
            echo "changed=0" >> "$GITHUB_OUTPUT"
          else
            git commit -m "atlas: рейтинги $(date -u +%F)"
            git pull --rebase
            git push
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Прислать таблицу изменений владельцу
        if: steps.pub.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Рейтинги обновлены: $(date -u +%F)" --body-file drafts/SCORES.md
      - name: Сообщить о сбое
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 'Сбой автообновления: ${{ github.workflow }}'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq 'length')
          if [ "$open" = "0" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "Автоматическое обновление не выполнено, сайт остался в прежнем состоянии. Журнал запуска: $RUN_URL"
          else
            echo "Задача о сбое уже открыта"
          fi
